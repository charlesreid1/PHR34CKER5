[project]
name = "phr34cker5-mcp"
version = "0.0.1"
description = "PHR34CKER5 — an MCP server that serves phreaking lore, zines, and skills. A time machine to DEFCON 5, 1997."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "PHR34CKER5" }]
keywords = ["mcp", "phreaking", "2600", "ctf", "lore", "bluebox", "defcon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Communications :: Telephony",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.2.0",
    "twilio>=9.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
# Laptop mode: auto-tunnel to Twilio via ngrok. Not needed on a VPS with
# PHR34CKER5_PUBLIC_URL set.
ngrok = ["pyngrok>=7.0.0"]
# Reserved for future: run only offline corpus/tone tools.
minimal = []

[project.scripts]
phr34cker5-mcp = "phr34cker5_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/phr34cker5/phr34cker5"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phr34cker5_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "phr34cker5_mcp/_knowledge"

[tool.hatch.build.targets.sdist]
include = [
    "src/phr34cker5_mcp",
    "knowledge",
    "skills",
    "README.md",
    "pyproject.toml",
]
